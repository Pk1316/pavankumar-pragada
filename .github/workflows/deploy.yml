name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be rebuilt from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a push that
# lands during a deploy still reaches the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins, so the deployed build matches the one verified
      # locally instead of quietly picking up newer releases.
      - run: npm ci

      - run: npm run lint

      # Runs `tsc -b` before `vite build`, so a type error fails the deploy
      # rather than shipping.
      - run: npm run build

      # Pages is already switched on for this repository, with its source set
      # to GitHub Actions, so this step only reads the existing configuration.
      #
      # `enablement: true` is kept for forks. Do not rely on it: creating a
      # Pages site needs admin rights on the repository, which the workflow's
      # GITHUB_TOKEN does not have, and the first run here failed on exactly
      # that. If this step ever reports that it cannot find a Pages site, turn
      # it on once under Settings, Pages, Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
